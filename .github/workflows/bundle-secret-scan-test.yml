name: Bundle Secret Scan Test

on:
  pull_request:
    paths:
      - bundle-secret-scan/**
      - .github/workflows/bundle-secret-scan-test.yml
  push:
    branches: [main]
    paths:
      - bundle-secret-scan/**

permissions:
  contents: read

env:
  FIXTURE: bundle-secret-scan/test/fixture

jobs:
  public-env-secret-fails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [stripe-live, stripe-restricted, stripe-webhook, resend, openai-project, anthropic, aws-access-key]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Build the fixture with no secret
        working-directory: ${{ env.FIXTURE }}
        run: npm ci --ignore-scripts && npm run build
      # The clean pass in this same job proves the install and the name check
      # succeed, so the failure below can only come from the output scan.
      - name: A clean build passes
        uses: ./bundle-secret-scan
        with:
          path: ${{ env.FIXTURE }}/dist
          source-path: ${{ env.FIXTURE }}
      - name: Rebuild with a fake key under VITE_
        working-directory: ${{ env.FIXTURE }}
        run: VITE_FIXTURE_VALUE="$(python3 ../make_canary.py "${{ matrix.kind }}")" npm run build
      - id: leaky
        uses: ./bundle-secret-scan
        continue-on-error: true
        with:
          path: ${{ env.FIXTURE }}/dist
          source-path: ${{ env.FIXTURE }}
      - name: The scan must fail
        if: steps.leaky.outcome != 'failure'
        run: |
          echo "::error::the ${{ matrix.kind }} key reached the bundle and the scan passed"
          exit 1

  path-allowlisted-file-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      # gitleaks' default config skips these paths by name, so a scan that
      # inherits its path allowlist passes them.
      - name: Serve a fake key from paths the default config skips
        run: |
          mkdir -p "$RUNNER_TEMP/served/js" "$RUNNER_TEMP/served/node_modules/x"
          key="$(python3 bundle-secret-scan/test/make_canary.py stripe-live)"
          echo "var k=\"$key\";" > "$RUNNER_TEMP/served/js/bootstrap.js"
          echo "var k=\"$key\";" > "$RUNNER_TEMP/served/node_modules/x/index.js"
      - id: skipped
        uses: ./bundle-secret-scan
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/served
          source-path: ${{ env.FIXTURE }}
      - name: The scan must fail
        if: steps.skipped.outcome != 'failure'
        run: |
          echo "::error::a key in a path the default config skips passed the scan"
          exit 1

  symlinked-directory-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Serve a fake key through a symlinked directory
        run: |
          mkdir -p "$RUNNER_TEMP/real" "$RUNNER_TEMP/served"
          echo "var k=\"$(python3 bundle-secret-scan/test/make_canary.py stripe-live)\";" > "$RUNNER_TEMP/real/app.js"
          ln -s "$RUNNER_TEMP/real" "$RUNNER_TEMP/served/assets"
          ln -s .. "$RUNNER_TEMP/real/loop"
      - id: linked
        uses: ./bundle-secret-scan
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/served
          source-path: ${{ env.FIXTURE }}
      - name: The scan must fail
        if: steps.linked.outcome != 'failure'
        run: |
          echo "::error::a key behind a symlinked directory passed the scan"
          exit 1

  unreadable-served-dir-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      # The hosted runner is not root, so mode 000 makes the walk fail.
      - name: Serve a directory the scan cannot read
        run: |
          mkdir -p "$RUNNER_TEMP/served/locked"
          echo 'var a = 1;' > "$RUNNER_TEMP/served/locked/app.js"
          chmod 000 "$RUNNER_TEMP/served/locked"
      - id: locked
        uses: ./bundle-secret-scan
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/served
          source-path: ${{ env.FIXTURE }}
      - name: The scan must fail
        if: steps.locked.outcome != 'failure'
        run: |
          echo "::error::an unreadable served directory passed the scan"
          exit 1

  secret-named-public-var-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Make a repo that reads a secret through VITE_
        run: |
          mkdir -p "$RUNNER_TEMP/named" "$RUNNER_TEMP/served"
          cd "$RUNNER_TEMP/named"
          git init -q
          echo 'const key = import.meta.env.VITE_PAYMENTS_SECRET_KEY;' > app.js
          echo 'const mixed = import.meta.env.VITE_payments_secret_key;' > mixed.js
          echo 'Never put a key in VITE_DOCS_ONLY_SECRET.' > README.md
          git add app.js mixed.js README.md
      # With the upper-case name allowed, only the mixed-case one can fail it.
      - id: mixed-only
        uses: ./bundle-secret-scan
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/served
          source-path: ${{ runner.temp }}/named
          allow-names: VITE_PAYMENTS_SECRET_KEY
      - name: The mixed-case name must fail
        if: steps.mixed-only.outcome != 'failure'
        run: |
          echo "::error::a mixed-case secret name passed the name check"
          exit 1
      # The allowed run passes on the same inputs, so this failure can only
      # come from the name.
      - id: named
        uses: ./bundle-secret-scan
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/served
          source-path: ${{ runner.temp }}/named
      - name: The name check must fail
        if: steps.named.outcome != 'failure'
        run: |
          echo "::error::a secret-named VITE_ var passed the name check"
          exit 1
      # Passing with only the code name allowed also proves README.md is skipped.
      - name: An allowed name passes, and prose is not checked
        uses: ./bundle-secret-scan
        with:
          path: ${{ runner.temp }}/served
          source-path: ${{ runner.temp }}/named
          allow-names: VITE_PAYMENTS_SECRET_KEY,VITE_payments_secret_key
