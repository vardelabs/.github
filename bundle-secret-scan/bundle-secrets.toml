title = "Client bundle secret scan"

# Provider-specific rules only. generic-api-key flags hashes and ids that
# minifiers emit, which would fail every build on noise.
[extend]
useDefault = true
disabledRules = ["generic-api-key"]

[[rules]]
id = "stripe-webhook-secret"
description = "Stripe webhook signing secret"
regex = '''\bwhsec_[A-Za-z0-9]{24,}\b'''
keywords = ["whsec_"]

[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''\bre_[A-Za-z0-9]{8,}_[A-Za-z0-9]{16,}\b'''
keywords = ["re_"]

[[rules]]
id = "openai-project-key"
description = "OpenAI project or service-account key"
regex = '''\bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_\-]{20,}'''
keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-"]

[[rules]]
id = "anthropic-key"
description = "Anthropic API or admin key"
regex = '''\bsk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_\-]{20,}'''
keywords = ["sk-ant-"]
